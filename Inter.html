<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>语音厅PK惩罚游戏 - 主持对决</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', 'Microsoft YaHei', sans-serif;
        }
        
        :root {
            --pk-red: #ff3860;
            --pk-blue: #3273dc;
            --accent-color: #ffdd57;
            --dark-bg: #121212;
            --darker-bg: #0a0a0a;
            --card-bg: #1e1e1e;
            --light-text: #f5f5f5;
            --shadow: 0 4px 12px rgba(0, 0, 0, 0.3);
            --neon-red: 0 0 10px rgba(255, 56, 96, 0.7);
            --neon-blue: 0 0 10px rgba(50, 115, 220, 0.7);
        }
        
        body {
            background-color: var(--dark-bg);
            color: var(--light-text);
            background-image: 
                radial-gradient(circle at 10% 20%, rgba(255, 56, 96, 0.1) 0%, transparent 20%),
                radial-gradient(circle at 90% 80%, rgba(50, 115, 220, 0.1) 0%, transparent 20%);
            min-height: 100vh;
            overflow-x: hidden;
        }
        
        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
        }
        
        /* 头部样式 */
        header {
            text-align: center;
            padding: 25px 0;
            margin-bottom: 30px;
        }
        
        .logo {
            font-size: 3.2rem;
            font-weight: 900;
            background: linear-gradient(90deg, var(--pk-red), var(--accent-color), var(--pk-blue));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-shadow: 0 0 15px rgba(255, 56, 96, 0.5);
            letter-spacing: 1px;
            margin-bottom: 10px;
        }
        
        .subtitle {
            font-size: 1.2rem;
            color: #aaa;
            max-width: 600px;
            margin: 0 auto;
            line-height: 1.6;
        }
        
        /* PK区域 */
        .pk-section {
            display: grid;
            grid-template-columns: 1fr 300px 1fr;
            gap: 30px;
            margin-bottom: 40px;
            align-items: center;
        }
        
        .player-card {
            background-color: var(--card-bg);
            border-radius: 20px;
            padding: 30px;
            box-shadow: var(--shadow);
            text-align: center;
            transition: all 0.3s ease;
            height: 100%;
        }
        
        .player-card.red {
            border: 3px solid var(--pk-red);
            box-shadow: var(--neon-red);
        }
        
        .player-card.blue {
            border: 3px solid var(--pk-blue);
            box-shadow: var(--neon-blue);
        }
        
        .player-avatar {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            margin: 0 auto 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3.5rem;
            color: white;
        }
        
        .player-avatar.red {
            background: linear-gradient(135deg, var(--pk-red), #ff6b9d);
        }
        
        .player-avatar.blue {
            background: linear-gradient(135deg, var(--pk-blue), #6b9dff);
        }
        
        .player-name {
            font-size: 1.8rem;
            margin-bottom: 10px;
            font-weight: bold;
        }
        
        .player-name.red {
            color: var(--pk-red);
        }
        
        .player-name.blue {
            color: var(--pk-blue);
        }
        
        .player-score {
            font-size: 2.8rem;
            font-weight: 900;
            margin: 15px 0;
        }
        
        .vs-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        
        .vs-text {
            font-size: 3.5rem;
            font-weight: 900;
            color: var(--accent-color);
            text-shadow: 0 0 10px rgba(255, 221, 87, 0.7);
            margin-bottom: 20px;
        }
        
        .pk-timer {
            font-size: 1.2rem;
            color: #aaa;
            background-color: rgba(0, 0, 0, 0.3);
            padding: 8px 20px;
            border-radius: 30px;
            margin-bottom: 15px;
        }
        
        /* 控制区域 */
        .controls-section {
            background-color: var(--card-bg);
            border-radius: 20px;
            padding: 25px;
            margin-bottom: 40px;
            box-shadow: var(--shadow);
        }
        
        .controls-title {
            font-size: 1.8rem;
            color: var(--accent-color);
            margin-bottom: 20px;
            text-align: center;
        }
        
        .controls-container {
            display: flex;
            justify-content: center;
            gap: 20px;
            flex-wrap: wrap;
        }
        
        .control-btn {
            padding: 15px 30px;
            border: none;
            border-radius: 12px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 10px;
            min-width: 180px;
            justify-content: center;
        }
        
        .start-btn {
            background: linear-gradient(135deg, #4CAF50, #2E7D32);
            color: white;
        }
        
        .start-btn:hover {
            transform: translateY(-5px);
            box-shadow: 0 7px 15px rgba(76, 175, 80, 0.4);
        }
        
        .reset-btn {
            background: linear-gradient(135deg, #f44336, #c62828);
            color: white;
        }
        
        .reset-btn:hover {
            transform: translateY(-5px);
            box-shadow: 0 7px 15px rgba(244, 67, 54, 0.4);
        }
        
        .punish-btn {
            background: linear-gradient(135deg, var(--pk-red), var(--pk-blue));
            color: white;
        }
        
        .punish-btn:hover {
            transform: translateY(-5px);
            box-shadow: 0 7px 15px rgba(255, 56, 96, 0.4);
        }
        
        /* 惩罚区域 */
        .punishment-section {
            background-color: var(--card-bg);
            border-radius: 20px;
            padding: 30px;
            box-shadow: var(--shadow);
            margin-bottom: 40px;
        }
        
        .punishment-title {
            font-size: 1.8rem;
            color: var(--accent-color);
            margin-bottom: 20px;
            text-align: center;
        }
        
        .punishment-categories {
            display: flex;
            gap: 15px;
            margin-bottom: 25px;
            flex-wrap: wrap;
            justify-content: center;
        }
        
        .category-btn {
            padding: 12px 25px;
            border: 2px solid transparent;
            border-radius: 30px;
            background-color: #2a2a2a;
            color: #ddd;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        .category-btn.active, .category-btn:hover {
            background-color: var(--pk-red);
            color: white;
            transform: translateY(-3px);
        }
        
        .punishment-list {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        
        .punishment-card {
            background-color: #2a2a2a;
            border-radius: 15px;
            padding: 20px;
            transition: all 0.3s ease;
            border-left: 5px solid var(--accent-color);
            cursor: pointer;
        }
        
        .punishment-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.4);
            background-color: #333;

        .punishment-card.selected {
            border-left: 5px solid var(--pk-red);

            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: bold;
            margin-bottom: 10px;
        }
        
        .level-easy {
            background-color: #4CAF50;
            color: white;

        .level-medium {
            background-color: #FF9800;
            color: white;

        .level-hard {
            background-color: #F44336;
            color: white;
        }
        
        .punishment-text {
            font-size: 1.1rem;

        .punishment-details {

        .punishment-execute {
            display: flex;
            justify-content: center;
            margin-top: 20px;
        }
        
        .execute-btn {
            padding: 15px 40px;
            background: linear-gradient(135deg, var(--pk-red), #ff6b9d);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 1.3rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .execute-btn:hover {
            transform: translateY(-5px);
            box-shadow: 0 7px 20px rgba(255, 56, 96, 0.5);
        }
        
        .execute-btn:disabled {
            background: #555;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }
        
        /* 惩罚结果区域 */
        .result-section {
            background-color: var(--card-bg);
            border-radius: 20px;
            padding: 30px;
            box-shadow: var(--shadow);
            display: none;
        }
        
        .result-title {
            font-size: 2rem;
            color: var(--pk-red);
            margin-bottom: 20px;
            text-align: center;
        }
        
        .result-content {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 30px;
            background-color: #2a2a2a;
            border-radius: 15px;
            min-height: 200px;
        }
        
        .result-text {
            font-size: 1.8rem;
            color: var(--accent-color);
            text-align: center;
            margin-bottom: 20px;
            line-height: 1.6;
        }
        
        .loser-name {
            color: var(--pk-red);
            font-weight: bold;
        }
        
        .punishment-executed {
            font-size: 1.3rem;
            color: #aaa;
            text-align: center;
            margin-top: 15px;
        }
        
        .timer-display {
            font-size: 1.2rem;
            color: #aaa;
            background-color: rgba(0, 0, 0, 0.3);
            padding: 8px 20px;
            border-radius: 30px;
            margin-top: 20px;
        }
        
        /* 历史记录 */
        .history-section {
            background-color: var(--card-bg);
            border-radius: 20px;
            padding: 25px;
            box-shadow: var(--shadow);
        }
        
        .history-title {
            font-size: 1.8rem;
            color: var(--accent-color);
            margin-bottom: 20px;
        }
        
        .history-list {
            max-height: 200px;
            overflow-y: auto;
            padding-right: 10px;
        }
        
        .history-item {
            padding: 12px 15px;
            background-color: #2a2a2a;
            border-radius: 10px;
            margin-bottom: 10px;
            border-left: 4px solid var(--pk-blue);
        }
        
        .history-item:nth-child(odd) {
            border-left-color: var(--pk-red);
        }
        
        /* 通知 */
        .notification {
            position: fixed;
            top: 20px;
            right: 20px;
            background-color: var(--pk-red);
            color: white;
            padding: 15px 25px;
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
            z-index: 1000;
            transform: translateX(300px);
            transition: transform 0.5s ease;
        }
        
        .notification.show {
            transform: translateX(0);
        }
        
        /* 响应式设计 */
        @media (max-width: 1100px) {
            .pk-section {
                grid-template-columns: 1fr;
                gap: 20px;
            }
            
            .vs-section {
                order: -1;
                flex-direction: row;
                justify-content: space-around;
                margin-bottom: 20px;
            }
            
            .player-card {
                max-width: 400px;
                margin: 0 auto;
            }
        }
        
        @media (max-width: 768px) {
            .logo {
                font-size: 2.5rem;
            }
            
            .punishment-list {
                grid-template-columns: 1fr;
            }
            
            .controls-container {
                flex-direction: column;
                align-items: center;
            }
            
            .control-btn {
                width: 100%;
                max-width: 300px;
            }
        }
    </style>
</head>
<body>
    <div class="container">

                    <i class="fas fa-tint"></i>

                </button>

        <!-- 惩罚选择区域 -->
        <section class="punishment-section">

            <div class="punishment-categories">
                <button class="category-btn active" data-category="all">全部惩罚</button>
                <button class="category-btn" data-category="funny">趣味整蛊</button>

                    <i class="fas fa-bolt"></i> 执行惩罚
                </button>
            </div>
        </section>
        
        <!-- 惩罚结果区域 -->
        <section class="result-section" id="result-section">

                    等待惩罚结果...
                </div>
                <div class="punishment-executed" id="punishment-details">
                    <!-- 惩罚详情 -->
                </div>
                <div class="timer-display" id="punishment-timer">
                    倒计时: <span id="countdown">60</span>秒
                </div>
            </div>
        </section>
        
        <!-- 历史记录 -->
        <section class="history-section">
            <h2 class="history-title">惩罚历史记录</h2>
            <div class="history-list" id="history-list">
                <div class="history-item">游戏尚未开始，暂无历史记录</div>
            </div>
        </section>
    </div>
    
    <!-- 通知 -->
    <div class="notification" id="notification">
        游戏开始！红队 vs 蓝队
    </div>

    <script>

        // DOM元素
        const startPkBtn = document.getElementById('start-pk');
        const selectLoserBtn = document.getElementById('select-loser');
        const resetGameBtn = document.getElementById('reset-game');
        const executePunishmentBtn = document.getElementById('execute-punishment');
        const punishmentList = document.getElementById('punishment-list');
        const categoryButtons = document.querySelectorAll('.category-btn');
        const resultSection = document.getElementById('result-section');
        const resultText = document.getElementById('result-text');
        const punishmentDetails = document.getElementById('punishment-details');
        const punishmentTimer = document.getElementById('punishment-timer');
        const countdownElement = document.getElementById('countdown');
        const historyList = document.getElementById('history-list');
        const notification = document.getElementById('notification');
        const timerElement = document.getElementById('timer');
        const roundElement = document.getElementById('round');
        const redScoreElement = document.querySelector('.player-score.red');
        const blueScoreElement = document.querySelector('.player-score.blue');
        
        // 初始化惩罚列表
        function initPunishmentList() {
            punishmentList.innerHTML = '';
            punishments.forEach(punishment => {
                const punishmentCard = document.createElement('div');
                punishmentCard.className = 'punishment-card';
                punishmentCard.dataset.id = punishment.id;
                punishmentCard.dataset.category = punishment.category;
                
                let levelClass = '';
                let levelText = '';
                switch(punishment.level) {
                    case 'easy': levelClass = 'level-easy'; levelText = '简单'; break;
                    case 'medium': levelClass = 'level-medium'; levelText = '中等'; break;
                    case 'hard': levelClass = 'level-hard'; levelText = '困难'; break;
                }
                
                punishmentCard.innerHTML = `
                    <div class="punishment-level ${levelClass}">${levelText}</div>
                    <div class="punishment-text">${punishment.text}</div>
                    <div class="punishment-details">
                        <span><i class="far fa-clock"></i> ${punishment.duration}秒</span>
                        <span><i class="fas fa-fire"></i> 热度: ${punishment.popularity}/10</span>
                    </div>
                `;
                
                punishmentCard.addEventListener('click', () => selectPunishment(punishment.id));
                punishmentList.appendChild(punishmentCard);
            });
            
            // 默认选择第一个惩罚
            selectPunishment(1);
        }
        
        // 过滤惩罚类别
        function filterPunishments(category) {
            const cards = document.querySelectorAll('.punishment-card');
            cards.forEach(card => {
                if (category === 'all' || card.dataset.category === category) {
                    card.style.display = 'block';
                } else {
                    card.style.display = 'none';
                }
            });
            
            // 更新类别按钮状态
            categoryButtons.forEach(btn => {
                if (btn.dataset.category === category) {
                    btn.classList.add('active');
                } else {
                    btn.classList.remove('active');
                }
            });
        }
        
        // 选择惩罚
        function selectPunishment(id) {
            // 移除之前的选择
            document.querySelectorAll('.punishment-card').forEach(card => {
                card.classList.remove('selected');
            });
            
            // 标记选中的惩罚
            const selectedCard = document.querySelector(`.punishment-card[data-id="${id}"]`);
            selectedCard.classList.add('selected');
            
            // 更新游戏状态
            gameState.selectedPunishment = punishments.find(p => p.id === id);
            
            // 如果已经选择了输家，启用执行按钮
            if (gameState.selectedLoser) {
                executePunishmentBtn.disabled = false;
            }
        }
        
        // 开始PK
        function startPk() {
            if (gameState.isPlaying) return;
            
            gameState.isPlaying = true;
            gameState.timer = 180; // 3分钟
            startPkBtn.disabled = true;
            startPkBtn.innerHTML = '<i class="fas fa-pause-circle"></i> PK进行中';
            
            // 显示通知
            showNotification('PK开始！红队 vs 蓝队，时间3分钟');
            
            // 开始倒计时
            const timerInterval = setInterval(() => {
                gameState.timer--;
                
                const minutes = Math.floor(gameState.timer / 60);
                const seconds = gameState.timer % 60;
                timerElement.textContent = `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
                
                // 时间到
                if (gameState.timer <= 0) {
                    clearInterval(timerInterval);
                    endPk();
                }
            }, 1000);
        }
        
        // 结束PK
        function endPk() {
            gameState.isPlaying = false;
            startPkBtn.disabled = false;
            startPkBtn.innerHTML = '<i class="fas fa-play-circle"></i> 开始PK';
            
            // 随机决定输家（模拟PK结果）
            const loser = Math.random() > 0.5 ? 'red' : 'blue';
            gameState.selectedLoser = loser;
            
            // 显示选择输家提示
            const loserName = loser === 'red' ? '红队主持' : '蓝队主持';
            showNotification(`PK结束！${loserName}输了，请选择惩罚`);
            
            // 更新分数（模拟）
            if (loser === 'red') {
                gameState.blueScore++;
                blueScoreElement.textContent = gameState.blueScore;
            } else {
                gameState.redScore++;
                redScoreElement.textContent = gameState.redScore;
            }
            
            // 启用执行按钮（如果已选择惩罚）
            if (gameState.selectedPunishment) {
                executePunishmentBtn.disabled = false;
            }
        }
        
        // 选择输家
        function selectLoserManually() {
            if (!gameState.isPlaying) {
                // 如果PK没进行，随机选一个输家
                const loser = Math.random() > 0.5 ? 'red' : 'blue';
                gameState.selectedLoser = loser;
                
                const loserName = loser === 'red' ? '红队主持' : '蓝队主持';
                showNotification(`已选择${loserName}为输家，请选择惩罚`);
                
                // 启用执行按钮（如果已选择惩罚）
                if (gameState.selectedPunishment) {
                    executePunishmentBtn.disabled = false;
                }
            }
        }
        
        // 执行惩罚
        function executePunishment() {
            if (!gameState.selectedLoser || !gameState.selectedPunishment) return;
            
            const loserName = gameState.selectedLoser === 'red' ? '红队主持' : '蓝队主持';
            const punishment = gameState.selectedPunishment;
            
            // 显示结果区域
            resultSection.style.display = 'block';
            
            // 更新结果文本
            resultText.innerHTML = `<span class="loser-name">${loserName}</span> 需要执行惩罚：<br>${punishment.text}`;
            
            // 更新惩罚详情
            let levelText = '';
            switch(punishment.level) {
                case 'easy': levelText = '简单'; break;
                case 'medium': levelText = '中等'; break;
                case 'hard': levelText = '困难'; break;
            }
            
            punishmentDetails.innerHTML = `
                <div>难度: ${levelText} | 时长: ${punishment.duration}秒 | 类别: ${getCategoryName(punishment.category)}</div>
            `;
            
            // 开始惩罚倒计时
            let countdown = punishment.duration;
            countdownElement.textContent = countdown;
            
            const countdownInterval = setInterval(() => {
                countdown--;
                countdownElement.textContent = countdown;
                
                if (countdown <= 0) {
                    clearInterval(countdownInterval);
                    punishmentTimer.innerHTML = '<i class="fas fa-check-circle"></i> 惩罚完成！';
                    showNotification('惩罚执行完毕！');
                    
                    // 记录历史
                    addToHistory(loserName, punishment.text);
                    
                    // 3秒后隐藏结果区域
                    setTimeout(() => {
                        resultSection.style.display = 'none';
                        punishmentTimer.innerHTML = `倒计时: <span id="countdown">${punishment.duration}</span>秒`;
                        
                        // 进入下一轮
                        gameState.round++;
                        roundElement.textContent = gameState.round;
                        
                        // 重置选择
                        gameState.selectedLoser = null;
                        gameState.selectedPunishment = null;
                        executePunishmentBtn.disabled = true;
                        
                        // 重新选择第一个惩罚
                        selectPunishment(1);
                    }, 3000);
                }
            }, 1000);
            
            // 显示通知
            showNotification(`惩罚开始！${loserName}有${punishment.duration}秒时间完成惩罚`);
            
            // 禁用执行按钮
            executePunishmentBtn.disabled = true;
        }
        
        // 获取类别名称
        function getCategoryName(category) {
            const categories = {
                'all': '全部',
                'funny': '趣味整蛊',
                'voice': '声音惩罚',
                'task': '任务挑战',
                'shame': '公开处刑',
                'creativity': '创意表演'
            };
            return categories[category] || category;
        }
        
        // 添加历史记录
        function addToHistory(loser, punishment) {
            const historyItem = document.createElement('div');
            historyItem.className = 'history-item';
            
            const now = new Date();
            const timeString = `${now.getHours().toString().padStart(2, '0')}:${now.getMinutes().toString().padStart(2, '0')}`;
            
            historyItem.innerHTML = `
                <strong>第${gameState.round}轮</strong> - ${timeString}<br>
                ${loser} 执行了惩罚: ${punishment}
            `;
            
            // 添加到历史列表顶部
            if (historyList.firstChild && historyList.firstChild.textContent.includes('游戏尚未开始')) {
                historyList.removeChild(historyList.firstChild);
            }
            
            historyList.insertBefore(historyItem, historyList.firstChild);
            
            // 保存到游戏状态
            gameState.punishmentHistory.unshift({
                round: gameState.round,
                time: timeString,
                loser: loser,
                punishment: punishment
            });
        }
        
        // 重置游戏
        function resetGame() {
            gameState.isPlaying = false;
            gameState.timer = 180;
            gameState.round = 1;
            gameState.redScore = 0;
            gameState.blueScore = 0;
            gameState.selectedLoser = null;
            gameState.selectedPunishment = null;
            gameState.punishmentHistory = [];
            
            // 更新UI
            timerElement.textContent = '03:00';
            roundElement.textContent = '1';
            redScoreElement.textContent = '0';
            blueScoreElement.textContent = '0';
            startPkBtn.disabled = false;
            startPkBtn.innerHTML = '<i class="fas fa-play-circle"></i> 开始PK';
            executePunishmentBtn.disabled = true;
            resultSection.style.display = 'none';
            
            // 清空历史
            historyList.innerHTML = '<div class="history-item">游戏已重置，暂无历史记录</div>';
            
            // 重新选择第一个惩罚
            selectPunishment(1);
            
            showNotification('游戏已重置！');
        }
        
        // 显示通知
        function showNotification(message) {
            notification.textContent = message;
            notification.classList.add('show');
            
            setTimeout(() => {
                notification.classList.remove('show');
            }, 3000);
        }
        
        // 事件监听
        startPkBtn.addEventListener('click', startPk);
        selectLoserBtn.addEventListener('click', selectLoserManually);
        resetGameBtn.addEventListener('click', resetGame);
        executePunishmentBtn.addEventListener('click', executePunishment);
        
        categoryButtons.forEach(btn => {
            btn.addEventListener('click', () => {
                filterPunishments(btn.dataset.category);
            });
        });
        
        // 初始化
        document.addEventListener('DOMContentLoaded', () => {
            initPunishmentList();
            
            // 模拟一些初始历史记录
            setTimeout(() => {
                if (historyList.firstChild.textContent.includes('游戏尚未开始')) {
                    historyList.innerHTML = `
                        <div class="history-item"><strong>演示记录</strong> - 14:30<br>红队主持 执行了惩罚: 用方言唱一首流行歌曲</div>
                        <div class="history-item"><strong>演示记录</strong> - 14:15<br>蓝队主持 执行了惩罚: 模仿一种动物叫声，持续30秒</div>
                        <div class="history-item"><strong>演示记录</strong> - 14:00<br>红队主持 执行了惩罚: 用奇怪的声音读一段绕口令</div>
                    `;
                }
            }, 1000);
            
            // 添加一些音效交互
            document.querySelectorAll('.control-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    // 可以在这里添加点击音效
                });
            });
            
            // 随机选择初始输家（演示用）
            setTimeout(() => {
                const randomLoser = Math.random() > 0.5 ? 'red' : 'blue';
                const loserName = randomLoser === 'red' ? '红队主持' : '蓝队主持';
                showNotification(`演示模式：${loserName}被随机选为输家，请选择惩罚`);
                gameState.selectedLoser = randomLoser;
                executePunishmentBtn.disabled = false;
            }, 2000);
        });
    </script>
