```html
<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>清一色酒吧 - 语音点歌休闲空间</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', 'Microsoft YaHei', sans-serif;
        }
        
        :root {
            --primary-color: #8a2be2;
            --secondary-color: #ff00ff;
            --accent-color: #00ffff;
            --dark-bg: #0a0a1a;
            --darker-bg: #050510;
            --light-text: #f0f0ff;
            --neon-shadow: 0 0 10px var(--secondary-color), 0 0 20px var(--secondary-color);
        }
        
        body {
            background-color: var(--dark-bg);
            color: var(--light-text);
            background-image: 
                radial-gradient(circle at 10% 20%, rgba(138, 43, 226, 0.15) 0%, transparent 20%),
                radial-gradient(circle at 90% 80%, rgba(255, 0, 255, 0.1) 0%, transparent 20%);
            min-height: 100vh;
            overflow-x: hidden;
        }
        
        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
        }
        
        /* 头部样式 */
        header {
            text-align: center;
            padding: 30px 0;
            margin-bottom: 30px;
            border-bottom: 2px solid var(--primary-color);
            position: relative;
        }
        
        .logo {
            font-size: 3.5rem;
            font-weight: 800;
            background: linear-gradient(90deg, var(--primary-color), var(--secondary-color), var(--accent-color));
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            text-shadow: 0 0 15px rgba(138, 43, 226, 0.7);
            letter-spacing: 2px;
            margin-bottom: 10px;
        }
        
        .tagline {
            font-size: 1.2rem;
            color: var(--accent-color);
            font-style: italic;
            margin-top: 10px;
        }
        
        /* 主内容区布局 */
        .main-content {
            display: grid;
            grid-template-columns: 1fr 350px;
            gap: 25px;
        }
        
        /* 直播区域 */
        .live-section {
            background-color: rgba(10, 10, 26, 0.7);
            border-radius: 15px;
            padding: 20px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(138, 43, 226, 0.3);
        }
        
        .section-title {
            font-size: 1.8rem;
            color: var(--accent-color);
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 1px solid var(--primary-color);
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .section-title i {
            color: var(--secondary-color);
        }
        
        .live-container {
            position: relative;
            width: 100%;
            height: 500px;
            background-color: #000;
            border-radius: 10px;
            overflow: hidden;
            margin-bottom: 20px;
        }
        
        .live-placeholder {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #1a1a2e, #16213e);
        }
        
        .live-placeholder i {
            font-size: 5rem;
            color: var(--primary-color);
            margin-bottom: 20px;
        }
        
        .live-placeholder p {
            font-size: 1.2rem;
            color: var(--accent-color);
            text-align: center;
            max-width: 80%;
        }
        
        /* 音乐播放器 */
        .music-player {
            background-color: rgba(20, 20, 40, 0.8);
            border-radius: 15px;
            padding: 20px;
            margin-top: 25px;
            border: 1px solid rgba(0, 255, 255, 0.2);
        }
        
        .player-controls {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 25px;
            margin: 20px 0;
        }
        
        .player-btn {
            background: transparent;
            border: none;
            color: var(--accent-color);
            font-size: 1.8rem;
            cursor: pointer;
            transition: all 0.3s ease;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .player-btn:hover {
            background-color: rgba(0, 255, 255, 0.1);
            transform: scale(1.1);
        }
        
        .play-btn {
            background-color: var(--primary-color);
            color: white;
            font-size: 2rem;
            box-shadow: var(--neon-shadow);
        }
        
        .play-btn:hover {
            background-color: var(--secondary-color);
        }
        
        .song-info {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 15px;
        }
        
        .song-cover {
            width: 80px;
            height: 80px;
            border-radius: 10px;
            object-fit: cover;
            border: 2px solid var(--secondary-color);
        }
        
        .song-title {
            font-size: 1.3rem;
            color: var(--light-text);
        }
        
        .song-artist {
            font-size: 1rem;
            color: var(--accent-color);
        }
        
        .progress-container {
            width: 100%;
            height: 6px;
            background-color: rgba(255, 255, 255, 0.1);
            border-radius: 3px;
            margin: 20px 0;
            cursor: pointer;
        }
        
        .progress-bar {
            height: 100%;
            background: linear-gradient(90deg, var(--primary-color), var(--secondary-color));
            border-radius: 3px;
            width: 30%;
            position: relative;
        }
        
        /* 侧边栏 */
        .sidebar {
            display: flex;
            flex-direction: column;
            gap: 25px;
        }
        
        /* 点歌功能 */
        .request-song {
            background-color: rgba(10, 10, 26, 0.7);
            border-radius: 15px;
            padding: 20px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(255, 0, 255, 0.3);
        }
        
        .request-form {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        
        .form-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }
        
        .form-group label {
            color: var(--accent-color);
            font-size: 0.9rem;
        }
        
        .form-group input {
            padding: 12px;
            background-color: rgba(20, 20, 40, 0.8);
            border: 1px solid rgba(138, 43, 226, 0.5);
            border-radius: 8px;
            color: var(--light-text);
            font-size: 1rem;
        }
        
        .form-group input:focus {
            outline: none;
            border-color: var(--secondary-color);
            box-shadow: 0 0 10px rgba(255, 0, 255, 0.5);
        }
        
        .submit-btn {
            background: linear-gradient(90deg, var(--primary-color), var(--secondary-color));
            color: white;
            border: none;
            padding: 15px;
            border-radius: 8px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 10px;
        }
        
        .submit-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 7px 15px rgba(138, 43, 226, 0.4);
        }
        
        /* 小游戏区域 */
        .games-section {
            background-color: rgba(10, 10, 26, 0.7);
            border-radius: 15px;
            padding: 20px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(0, 255, 255, 0.3);
        }
        
        .games-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-top: 15px;
        }
        
        .game-card {
            background-color: rgba(20, 20, 40, 0.8);
            border-radius: 10px;
            padding: 15px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            border: 1px solid rgba(138, 43, 226, 0.3);
        }
        
        .game-card:hover {
            transform: translateY(-5px);
            border-color: var(--accent-color);
            box-shadow: 0 5px 15px rgba(0, 255, 255, 0.2);
        }
        
        .game-icon {
            font-size: 2.5rem;
            color: var(--secondary-color);
            margin-bottom: 10px;
        }
        
        .game-title {
            font-size: 1.1rem;
            color: var(--light-text);
        }
        
        /* 游戏模态框 */
        .game-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.85);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }
        
        .game-content {
            background-color: var(--darker-bg);
            border-radius: 15px;
            padding: 25px;
            width: 90%;
            max-width: 500px;
            border: 2px solid var(--primary-color);
            position: relative;
        }
        
        .close-modal {
            position: absolute;
            top: 15px;
            right: 15px;
            background: transparent;
            border: none;
            color: var(--accent-color);
            font-size: 1.8rem;
            cursor: pointer;
        }
        
        /* 骰子游戏样式 */
        .dice-game {
            text-align: center;
        }
        
        .dice-container {
            display: flex;
            justify-content: center;
            gap: 30px;
            margin: 30px 0;
        }
        
        .dice {
            width: 80px;
            height: 80px;
            background-color: white;
            border-radius: 15px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 2.5rem;
            color: #333;
            font-weight: bold;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
        }
        
        .roll-btn {
            background: linear-gradient(90deg, var(--primary-color), var(--secondary-color));
            color: white;
            border: none;
            padding: 15px 30px;
            border-radius: 8px;
            font-size: 1.2rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        .roll-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 0 20px rgba(255, 0, 255, 0.5);
        }
        
        /* 通知样式 */
        .notification {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background-color: var(--primary-color);
            color: white;
            padding: 15px 25px;
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
            z-index: 100;
            transform: translateY(100px);
            opacity: 0;
            transition: all 0.5s ease;
        }
        
        .notification.show {
            transform: translateY(0);
            opacity: 1;
        }
        
        /* 响应式设计 */
        @media (max-width: 1024px) {
            .main-content {
                grid-template-columns: 1fr;
            }
            
            .live-container {
                height: 400px;
            }
        }
        
        @media (max-width: 768px) {
            .logo {
                font-size: 2.5rem;
            }
            
            .games-container {
                grid-template-columns: 1fr;
            }
            
            .live-container {
                height: 300px;
            }
        }
    </style>
</head>

                    <div class="games-container">

    <!-- 游戏模态框 -->
    <div class="game-modal" id="game-modal">
        <div class="game-content">
            <button class="close-modal" id="close-modal">&times;</button>
            <div id="game-container">
                <!-- 游戏内容将动态加载到这里 -->
            </div>
        </div>
    </div>
    
    <!-- 通知 -->
    <div class="notification" id="notification">
        点歌请求已提交！主播会尽快为您播放
    </div>
    
    <!-- 音频元素 -->
    <audio id="background-music" loop>
        <source src="https://assets.mixkit.co/music/preview/mixkit-tech-house-vibes-130.mp3" type="audio/mpeg">
        您的浏览器不支持音频元素
    </audio>
    
    <!-- 骰子音效 -->
    <audio id="dice-sound">
        <source src="https://assets.mixkit.co/sfx/preview/mixkit-dice-roll-1994.mp3" type="audio/mpeg">
    </audio>

    <script>
        // 音乐播放器功能
        const backgroundMusic = document.getElementById('background-music');
        const playBtn = document.getElementById('play-btn');
        const prevBtn = document.getElementById('prev-btn');
        const nextBtn = document.getElementById('next-btn');
        const volumeBtn = document.getElementById('volume-btn');
        const progressBar = document.querySelector('.progress-bar');
        const progressContainer = document.querySelector('.progress-container');
        const songTitle = document.querySelector('.song-title');
        const songArtist = document.querySelector('.song-artist');
        const songCover = document.querySelector('.song-cover');
        
        // 歌曲列表
        const songs = [
            {
                title: "夜空中最亮的星",
                artist: "逃跑计划",
                cover: "https://images.unsplash.com/photo-1493225457124-a3eb161ffa5f?ixlib=rb-4.0.3&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D&auto=format&fit=crop&w=600&q=80"
            },
            {
                title: "成都",
                artist: "赵雷",
                cover: "https://images.unsplash.com/photo-1511379938547-c1f69419868d?ixlib=rb-4.0.3&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D&auto=format&fit=crop&w=600&q=80"
            },
            {
                title: "平凡之路",
                artist: "朴树",
                cover: "https://images.unsplash.com/photo-1511671782779-c97d3d27a1d4?ixlib=rb-4.0.3&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D&auto=format&fit=crop&w=600&q=80"
            }
        ];
        
        let currentSongIndex = 0;
        let isPlaying = false;
        
        // 更新歌曲信息
        function updateSongInfo() {
            songTitle.textContent = songs[currentSongIndex].title;
            songArtist.textContent = songs[currentSongIndex].artist;
            songCover.src = songs[currentSongIndex].cover;
        }
        
        // 播放/暂停音乐
        function togglePlay() {
            if (isPlaying) {
                backgroundMusic.pause();
                playBtn.innerHTML = '<i class="fas fa-play"></i>';
            } else {
                backgroundMusic.play();
                playBtn.innerHTML = '<i class="fas fa-pause"></i>';
            }
            isPlaying = !isPlaying;
        }
        
        // 切换歌曲
        function changeSong(direction) {
            currentSongIndex += direction;
            
            if (currentSongIndex < 0) {
                currentSongIndex = songs.length - 1;
            } else if (currentSongIndex >= songs.length) {
                currentSongIndex = 0;
            }
            
            updateSongInfo();
            
            // 如果是播放状态，继续播放新歌曲
            if (isPlaying) {
                backgroundMusic.play();
            }
        }
        
        // 更新进度条
        function updateProgress() {
            const { currentTime, duration } = backgroundMusic;
            const progressPercent = (currentTime / duration) * 100;
            progressBar.style.width = `${progressPercent}%`;
        }
        
        // 设置进度条
        function setProgress(e) {
            const width = this.clientWidth;
            const clickX = e.offsetX;
            const duration = backgroundMusic.duration;
            
            backgroundMusic.currentTime = (clickX / width) * duration;
        }
        
        // 切换音量
        function toggleVolume() {
            if (backgroundMusic.volume === 0) {
                backgroundMusic.volume = 0.5;
                volumeBtn.innerHTML = '<i class="fas fa-volume-up"></i>';
            } else if (backgroundMusic.volume === 0.5) {
                backgroundMusic.volume = 1;
                volumeBtn.innerHTML = '<i class="fas fa-volume-up"></i>';
            } else {
                backgroundMusic.volume = 0;
                volumeBtn.innerHTML = '<i class="fas fa-volume-mute"></i>';
            }
        }
        
        // 事件监听
        playBtn.addEventListener('click', togglePlay);
        prevBtn.addEventListener('click', () => changeSong(-1));
        nextBtn.addEventListener('click', () => changeSong(1));
        volumeBtn.addEventListener('click', toggleVolume);
        backgroundMusic.addEventListener('timeupdate', updateProgress);
        progressContainer.addEventListener('click', setProgress);
        
        // 初始化
        updateSongInfo();
        
        // 点歌功能
        const songRequestForm = document.getElementById('song-request-form');
        const notification = document.getElementById('notification');
        
        songRequestForm.addEventListener('submit', function(e) {
            e.preventDefault();
            
            const songName = document.getElementById('song-name').value;
            const songArtist = document.getElementById('song-artist').value;
            const requesterName = document.getElementById('requester-name').value || '匿名';
            
            // 显示通知
            notification.textContent = `感谢${requesterName}点歌《${songName}》${songArtist ? ` - ${songArtist}` : ''}，主播会尽快为您播放！`;
            notification.classList.add('show');
            
            // 3秒后隐藏通知
            setTimeout(() => {
                notification.classList.remove('show');
            }, 3000);
            
            // 重置表单
            songRequestForm.reset();
            
            // 这里可以添加将点歌请求发送到服务器的代码
            console.log(`点歌请求: 歌曲《${songName}》, 歌手${songArtist}, 点歌人${requesterName}`);
        });
        
        // 小游戏功能
        const gameCards = document.querySelectorAll('.game-card');
        const gameModal = document.getElementById('game-modal');
        const closeModal = document.getElementById('close-modal');
        const gameContainer = document.getElementById('game-container');
        const diceSound = document.getElementById('dice-sound');
        
        // 骰子游戏
        function loadDiceGame() {
            gameContainer.innerHTML = `
                <div class="dice-game">
                    <h2 style="color: var(--accent-color); margin-bottom: 20px;">骰子游戏</h2>
                    <p>点击掷骰子，看看你的运气如何！</p>
